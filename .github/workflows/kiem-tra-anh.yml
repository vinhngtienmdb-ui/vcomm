# Build thử hai ảnh container cho hai kiến trúc khi đổi Dockerfile hoặc tệp khởi động (CONG_VIEC_76). Không đẩy ảnh, không cần khóa bí mật.
# arm64 là kiến trúc của máy ảo Oracle chạy môi trường thật (THAY_DOI_42); build trên máy chạy Arm của GitHub, không giả lập.
name: Kiểm tra ảnh container

on:
  pull_request:
    paths:
      - "infra/docker/**"
      - ".dockerignore"
      - ".github/workflows/kiem-tra-anh.yml"
      - "infra/compose/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kiem-tra-anh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ảnh ${{ matrix.anh }} (${{ matrix.kien_truc }})
    runs-on: ${{ matrix.kien_truc == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        anh: [api, web]
        kien_truc: [amd64, arm64]
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build ảnh
        run: docker build --platform linux/${{ matrix.kien_truc }} -f infra/docker/${{ matrix.anh }}.Dockerfile -t vcomm-${{ matrix.anh }}:kiem-tra .

      # Chặn lỗ hổng mức HIGH, CRITICAL đã có bản vá (người dùng duyệt Trivy 2026-11-18); lỗ hổng chưa có bản vá xử lý theo tài liệu 22 mục 8.
      - name: Quét lỗ hổng ảnh
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (2026-04-22)
        with:
          image-ref: vcomm-${{ matrix.anh }}:kiem-tra
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      # Ảnh không được chứa tệp môi trường, mã nguồn kiểm thử.
      - name: Kiểm nội dung ảnh
        run: |
          found=$(docker run --rm --entrypoint sh vcomm-${{ matrix.anh }}:kiem-tra -c 'find /app \( -name node_modules -o -name .next \) -prune -o \( -name ".env" -o -name ".env.local" -o -name ".env.production" -o -path /app/apps/api/src -o -path /app/apps/api/test \) -print')
          if [ -n "$found" ]; then echo "Ảnh chứa tệp không được phép:"; echo "$found"; exit 1; fi
          echo "Đạt"

      - name: Kiểm kiến trúc ảnh
        run: |
          arch=$(docker image inspect vcomm-${{ matrix.anh }}:kiem-tra --format '{{.Architecture}}')
          [ "$arch" = "${{ matrix.kien_truc }}" ] || { echo "Ảnh là $arch, cần ${{ matrix.kien_truc }}"; exit 1; }
          echo "Đạt: $arch"

      - name: Kiểm khởi động (api)
        if: matrix.anh == 'api'
        run: docker run --rm vcomm-api:kiem-tra node -e "require('/app/apps/api/dist/database/run-migrations.js'); console.log('nạp mô-đun đạt')"

  # Chạy thử tệp compose của môi trường thật (THAY_DOI_42) với postgres:17 cục bộ thay Supabase, không có cloudflared.
  chay-thu-compose:
    name: Chạy thử Docker Compose môi trường thật
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build hai ảnh
        run: |
          docker build -f infra/docker/api.Dockerfile -t ghcr.io/vinhngtienmdb-ui/vcomm-api:kiem-tra .
          docker build -f infra/docker/web.Dockerfile -t ghcr.io/vinhngtienmdb-ui/vcomm-web:kiem-tra .

      - name: Tạo tệp .env thử từ tệp mẫu
        working-directory: infra/compose
        run: |
          mkdir -p certificates
          sed -e 's/^VCOMM_VERSION=$/VCOMM_VERSION=kiem-tra/' \
              -e 's/^CLOUDFLARE_TUNNEL_TOKEN=$/CLOUDFLARE_TUNNEL_TOKEN=khong-dung/' \
              -e 's#^DATABASE_URL=$#DATABASE_URL=postgres://vcomm_ung_dung:mat_khau_kiem_tra@postgres:5432/vcomm#' \
              -e "s/^ACCESS_TOKEN_SECRET=\$/ACCESS_TOKEN_SECRET=$(openssl rand -hex 32)/" \
              -e "s/^MFA_SECRET_KEY=\$/MFA_SECRET_KEY=$(openssl rand -hex 32)/" \
              -e 's/^EMAIL_DRIVER=smtp$/EMAIL_DRIVER=log/' \
              -e 's/^STORAGE_DRIVER=s3$/STORAGE_DRIVER=local/' \
              env.production.example > .env
          echo "STORAGE_DIRECTORY=/tmp/tep" >> .env

      - name: Bật cơ sở dữ liệu, Redis
        working-directory: infra/compose
        run: docker compose -f compose.production.yml -f compose.kiem-tra.yml up -d --wait postgres redis

      - name: Database migration (chạy hai lần, lần hai không còn tệp mới)
        working-directory: infra/compose
        run: |
          docker compose -f compose.production.yml -f compose.kiem-tra.yml run --rm --no-deps api node apps/api/dist/database/run-migrations.js
          second=$(docker compose -f compose.production.yml -f compose.kiem-tra.yml run --rm --no-deps api node apps/api/dist/database/run-migrations.js)
          echo "$second"
          echo "$second" | grep -q "Không có database migration mới"

      - name: Bật api, worker, web và chờ kiểm tra sống
        working-directory: infra/compose
        run: docker compose -f compose.production.yml -f compose.kiem-tra.yml up -d --wait --wait-timeout 300 api worker web

      - name: Gọi thử
        working-directory: infra/compose
        run: |
          for url in http://127.0.0.1:4000/api/v1/auth/methods http://127.0.0.1:3000/dang-nhap http://127.0.0.1:3000/api/v1/auth/methods http://127.0.0.1:3000/catalog; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$url")
            echo "$url: $code"
            case "$code" in 200|307|308) ;; *) exit 1 ;; esac
          done
          # Tác vụ nền chỉ chạy ở worker.
          docker compose -f compose.production.yml -f compose.kiem-tra.yml logs api | grep -q "Không chạy tác vụ nền"
          if docker compose -f compose.production.yml -f compose.kiem-tra.yml logs worker | grep -q "Không chạy tác vụ nền"; then echo "worker không chạy tác vụ nền"; exit 1; fi
          echo "Đạt"

      - name: Log khi lỗi
        if: failure()
        working-directory: infra/compose
        run: docker compose -f compose.production.yml -f compose.kiem-tra.yml logs --tail 200

      - name: Dọn
        if: always()
        working-directory: infra/compose
        run: docker compose -f compose.production.yml -f compose.kiem-tra.yml down -v
