# Triển khai một phiên bản lên môi trường thật (máy ảo Oracle, Docker Compose), hoặc quay lui (CONG_VIEC_76, THAY_DOI_42, tài liệu 26 mục 2).
# Chạy tay từ nhánh main. Môi trường GitHub "production" bắt người dùng duyệt từng lần chạy. Khóa bí mật nằm trong biến bí mật của môi trường GitHub.
# Chạy trên máy Arm của GitHub để build ảnh linux/arm64 đúng kiến trúc máy ảo.
name: Triển khai

on:
  workflow_dispatch:
    inputs:
      phien_ban:
        description: "Mã phiên bản, ví dụ 0.14.1 (phải có tag v0.14.1)"
        required: true
        type: string
      hanh_dong:
        description: "trien-khai: sao lưu, migration, đổi phiên bản. quay-lui: về phiên bản đã nhập, không chạy migration"
        required: true
        type: choice
        default: trien-khai
        options: [trien-khai, quay-lui]

permissions:
  contents: read
  packages: write

concurrency:
  group: trien-khai-production
  cancel-in-progress: false

jobs:
  trien-khai:
    name: ${{ inputs.hanh_dong }} ${{ inputs.phien_ban }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    environment: production
    env:
      VERSION: ${{ inputs.phien_ban }}
      IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
      BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET }}
      BACKUP_PREFIX: production
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
      DEPLOY_SSH_KEY_FILE: ${{ github.workspace }}/tam_thoi/ssh/khoa
      DEPLOY_SSH_KNOWN_HOSTS_FILE: ${{ github.workspace }}/tam_thoi/ssh/known_hosts
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
      PUBLIC_WEB_URL: ${{ vars.PUBLIC_WEB_URL }}
    steps:
      - name: Chỉ triển khai từ nhánh main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Luồng triển khai chỉ chạy từ nhánh main (mã hạ tầng đã duyệt)."
          exit 1

      - name: Lấy mã nguồn (kèm tag)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Kiểm tag và bản vá khẩn cấp
        run: infra/scripts/deploy.sh check-tag

      - name: Chuẩn bị khóa SSH (chỉ trong máy chạy, xóa khi xong)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ vars.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 tam_thoi/ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$DEPLOY_SSH_KEY_FILE" && chmod 600 "$DEPLOY_SSH_KEY_FILE"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$DEPLOY_SSH_KNOWN_HOSTS_FILE"

      - name: Đăng nhập kho ảnh GitHub
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin

      - name: Build và đẩy ảnh arm64 (nếu chưa có)
        if: inputs.hanh_dong == 'trien-khai'
        run: |
          if docker manifest inspect "$IMAGE_REPOSITORY/vcomm-api:$VERSION" >/dev/null 2>&1 && docker manifest inspect "$IMAGE_REPOSITORY/vcomm-web:$VERSION" >/dev/null 2>&1; then
            echo "Ảnh $VERSION đã có, không build lại."
            docker pull --quiet "$IMAGE_REPOSITORY/vcomm-api:$VERSION"
            docker pull --quiet "$IMAGE_REPOSITORY/vcomm-web:$VERSION"
          else
            infra/scripts/deploy.sh build
          fi

      # Chặn lỗ hổng mức HIGH, CRITICAL đã có bản vá trước khi sao lưu, migration (người dùng duyệt Trivy 2026-11-18).
      - name: Quét lỗ hổng ảnh api
        if: inputs.hanh_dong == 'trien-khai'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (2026-04-22)
        with:
          image-ref: ${{ env.IMAGE_REPOSITORY }}/vcomm-api:${{ inputs.phien_ban }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Quét lỗ hổng ảnh web
        if: inputs.hanh_dong == 'trien-khai'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (2026-04-22)
        with:
          image-ref: ${{ env.IMAGE_REPOSITORY }}/vcomm-web:${{ inputs.phien_ban }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Ghi phiên bản đang chạy
        run: infra/scripts/deploy.sh record

      # Luôn sao lưu trước migration, không tắt được (Supabase gói miễn phí không tự sao lưu).
      - name: Cài age, công cụ AWS
        if: inputs.hanh_dong == 'trien-khai'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q age
          command -v aws >/dev/null || pipx install awscli

      - name: Sao lưu cơ sở dữ liệu
        if: inputs.hanh_dong == 'trien-khai'
        run: infra/scripts/deploy.sh backup

      - name: Chép tệp compose lên máy ảo
        run: infra/scripts/deploy.sh sync

      - name: Database migration
        if: inputs.hanh_dong == 'trien-khai'
        run: infra/scripts/deploy.sh migrate

      - name: Đổi phiên bản (tự về phiên bản trước nếu không qua kiểm tra sống)
        if: inputs.hanh_dong == 'trien-khai'
        run: infra/scripts/deploy.sh release

      - name: Quay lui
        if: inputs.hanh_dong == 'quay-lui'
        env:
          ROLLBACK_VERSION: ${{ inputs.phien_ban }}
        run: infra/scripts/deploy.sh rollback

      - name: Kiểm tra sau triển khai
        run: infra/scripts/deploy.sh verify

      - name: Xóa khóa SSH
        if: always()
        run: rm -rf tam_thoi/ssh
