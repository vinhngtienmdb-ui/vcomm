packages:
  - "apps/*"
  - "packages/*"

# Gói được chạy script khi cài (pnpm 10 chặn mặc định): argon2 dựng mã gốc băm mật khẩu, @swc/core tải bản dựng cho Vitest.
onlyBuiltDependencies:
  - "@swc/core"
  - argon2
# Không cần dựng: chỉ dùng để theo dõi tệp khi phát triển.
ignoredBuiltDependencies:
  - "@parcel/watcher"
# LOI_16: chấp nhận rủi ro có thời hạn (người dùng duyệt 2026-11-18, hết hạn 2026-12-18) cho lỗ hổng picomatch chưa có bản vá.
# Chỉ nằm trong công cụ dựng và phát triển (@nestjs/cli, @expo/cli), không chạy trên máy chủ, ứng dụng. Có bản vá thì nâng phiên bản và gỡ dòng này.
auditConfig:
