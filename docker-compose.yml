# Chỉ dùng cho máy phát triển (tài liệu 12 mục 4).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: vcomm
      POSTGRES_USER: vcomm_ung_dung
      POSTGRES_PASSWORD: mat_khau_phat_trien
    ports:
      - "5432:5432"
    volumes:
      - du_lieu_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vcomm_ung_dung -d vcomm"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
volumes:
  du_lieu_postgres:
